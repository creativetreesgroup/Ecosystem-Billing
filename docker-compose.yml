# Creative Trees Billing — stack Docker lengkap.
#
#   docker compose up -d                      # aplikasi (7 service)
#   docker compose --profile monitoring up -d # + Grafana/Prometheus/exporters
#
# Satu image aplikasi (Dockerfile) dipakai untuk web, reverb, worker, scheduler;
# perannya ditentukan `command`. Semua membaca satu .env; override khusus-Docker
# (host DB/Redis/Reverb) diletakkan di `environment` agar menang atas .env.

x-app-env: &app-env
  DB_HOST: db
  DB_PORT: "3306"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: database
  BROADCAST_CONNECTION: reverb
  REVERB_HOST: reverb   # app -> reverb lewat jaringan Docker (browser pakai VITE_REVERB_HOST)
  REVERB_PORT: "8080"

x-app: &app-base
  build:
    context: .
    dockerfile: Dockerfile
  image: creative-trees-billing:latest
  env_file: .env
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks: [ctb]

services:
  app:
    <<: *app-base
    environment:
      <<: *app-env
    # Volume persisten HANYA di container app: ia satu-satunya yang menulis
    # unggahan/QR ke storage/app dan yang butuh lognya awet. Kalau volume yang
    # sama dipasang di app+reverb+worker+scheduler sekaligus, keempatnya BALAPAN
    # menyemai volume-baru dari image saat start pertama → "mkdir private: file
    # exists" dan stack gagal naik. Worker/reverb/scheduler menulis ke DB & stdout.
    volumes:
      - app-storage:/var/www/html/storage/app
      - app-logs:/var/www/html/storage/logs
    healthcheck:
      test: ["CMD", "fpm-healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-80}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
    # Sengaja /health, bukan /ready: mematikan nginx karena MySQL sedang
    # restart hanya memperpanjang pemadaman. /ready dipakai load balancer
    # untuk mengeluarkan instance dari rotasi, bukan untuk membunuhnya.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [ctb]

  reverb:
    <<: *app-base
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    environment:
      <<: *app-env
    ports:
      - "${REVERB_PORT:-8080}:8080"   # opsional: browser bisa ws langsung; atau lewat /app di nginx
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8080 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    <<: *app-base
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    environment:
      <<: *app-env

  scheduler:
    <<: *app-base
    command: php artisan schedule:work
    environment:
      <<: *app-env

  # Suite test. SENGAJA tanpa `env_file: .env` — itu bukan kelalaian, itu inti
  # keamanannya. Variabel <env> di phpunit.xml hanya berlaku bila belum ada di
  # proses, jadi container yang mewarisi .env aplikasi membuat test memakai
  # APP_ENV=production DAN database produksi: RefreshDatabase lalu menjalankan
  # migrate:fresh (DROP semua tabel) di data outlet sungguhan. Kebetulan
  # migrate:fresh dipanggil tanpa --force sehingga ConfirmableTrait menahannya
  # di environment "production" — satu-satunya alasan data tidak hilang, dan
  # itu keberuntungan, bukan rancangan.
  #
  # Yang di bawah hanya alamat: ke mana harus menyambung, bukan sebagai siapa.
  # Nama database, APP_ENV, cache/queue/session driver semuanya datang dari
  # phpunit.xml. Kode di-mount dari host karena image dibangun --no-dev (tanpa
  # Pest); vendor host yang berisi dev-dependencies yang dipakai.
  test:
    build:
      context: .
      dockerfile: Dockerfile
    image: creative-trees-billing:latest
    profiles: [test]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [ctb]
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_USERNAME: "${DB_USERNAME:-ctb_app}"
      DB_PASSWORD: "${DB_PASSWORD:-change_me}"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # Cache Blade menyimpan path absolut file sumber di dalam hasil
      # kompilasinya. Kode di-mount dari host, jadi cache yang ditulis saat
      # `npm`/artisan dijalankan di macOS menunjuk /Users/... — path yang tidak
      # ada di container, dan filemtime() gagal di tengah render. Cache test
      # diberi rumah sendiri di dalam container supaya kedua sisi tidak saling
      # merusak, dan cache host tidak perlu dihapus untuk menjalankan test.
      VIEW_COMPILED_PATH: /tmp/views
    volumes:
      - .:/var/www/html
    command: php artisan test

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-creative_trees_billing}"
      MYSQL_USER: "${DB_USERNAME:-ctb_app}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-change_me}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-change_me_root}"
    # caching_sha2_password sudah default di MySQL 8.4; flag lama
    # --default-authentication-plugin DIHAPUS di 8.4 (mysqld gagal start bila dipakai).
    # Dua flag durabilitas ditulis EKSPLISIT walau keduanya sudah default di
    # MySQL 8.4 — justru karena diam-diam benar itulah bahayanya. Keduanya
    # adalah flag pertama yang dimatikan orang saat mengejar angka benchmark,
    # dan di mesin outlet yang listriknya bisa padam kapan saja, mematikannya
    # berarti transaksi yang SUDAH dinyatakan lunas ke pelanggan hilang saat
    # mesin menyala kembali. Uang yang sudah diterima tidak boleh bergantung
    # pada nilai bawaan yang tak seorang pun ingat.
    #   flush_log_at_trx_commit=1 : commit di-fsync ke disk saat itu juga
    #   sync_binlog=1             : binlog ikut di-fsync, backup tetap konsisten
    command: >-
      --innodb-buffer-pool-size=256M
      --innodb-flush-log-at-trx-commit=1
      --sync-binlog=1
    volumes:
      - db-data:/var/lib/mysql
      # Dijalankan hanya saat volume data masih kosong (perilaku image MySQL).
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD:-change_me_root}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [ctb]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [ctb]

  # ---------- Monitoring (profil: monitoring) ----------
  prometheus:
    image: prom/prometheus:latest
    profiles: [monitoring]
    restart: unless-stopped
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks: [ctb]

  grafana:
    image: grafana/grafana-oss:latest
    profiles: [monitoring]
    restart: unless-stopped
    depends_on: [prometheus]
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD:-admin}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks: [ctb]

  # Profil TERPISAH dari `monitoring` karena service ini satu-satunya yang tidak
  # bisa jalan di mana pun: ia mem-bind `/` dengan propagasi rslave dan memakai
  # PID namespace host — dua hal yang tidak ada di Docker Desktop (macOS/Windows),
  # sehingga `--profile monitoring up` GAGAL TOTAL di sana dan menjatuhkan
  # seluruh stack hanya demi metrik host. install.sh menambahkan profil ini
  # otomatis di Linux. Di Docker Desktop metriknya pun tak berguna: yang terukur
  # adalah VM LinuxKit, bukan mesin Anda.
  node-exporter:
    image: prom/node-exporter:latest
    profiles: [host-metrics]
    restart: unless-stopped
    command:
      - '--path.rootfs=/host'
    pid: host
    volumes:
      - /:/host:ro,rslave
    networks: [ctb]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    profiles: [monitoring]
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks: [ctb]

  mysql-exporter:
    image: prom/mysqld-exporter:latest
    profiles: [monitoring]
    restart: unless-stopped
    command:
      - "--mysqld.address=db:3306"
      - "--mysqld.username=root"
    environment:
      MYSQLD_EXPORTER_PASSWORD: "${DB_ROOT_PASSWORD:-change_me_root}"
    depends_on: [db]
    networks: [ctb]

  redis-exporter:
    image: oliver006/redis_exporter:latest
    profiles: [monitoring]
    restart: unless-stopped
    command: ["--redis.addr=redis://redis:6379"]
    depends_on: [redis]
    networks: [ctb]

volumes:
  db-data:
  redis-data:
  app-storage:
  app-logs:
  prometheus-data:
  grafana-data:

networks:
  ctb:
    driver: bridge
