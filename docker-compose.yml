# Creative Trees Billing — stack Docker lengkap.
#
#   docker compose up -d                      # aplikasi (7 service)
#   docker compose --profile monitoring up -d # + Grafana/Prometheus/exporters
#
# Satu image aplikasi (Dockerfile) dipakai untuk web, reverb, worker, scheduler;
# perannya ditentukan `command`. Semua membaca satu .env; override khusus-Docker
# (host DB/Redis/Reverb) diletakkan di `environment` agar menang atas .env.

x-app-env: &app-env
  DB_HOST: db
  DB_PORT: "3306"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: database
  BROADCAST_CONNECTION: reverb
  REVERB_HOST: reverb   # app -> reverb lewat jaringan Docker (browser pakai VITE_REVERB_HOST)
  REVERB_PORT: "8080"

x-app: &app-base
  build:
    context: .
    dockerfile: Dockerfile
  image: creative-trees-billing:latest
  env_file: .env
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  volumes:
    - app-storage:/var/www/html/storage/app
    - app-logs:/var/www/html/storage/logs
  networks: [ctb]

services:
  app:
    <<: *app-base
    environment:
      <<: *app-env
    healthcheck:
      test: ["CMD", "fpm-healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-80}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
    networks: [ctb]

  reverb:
    <<: *app-base
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    environment:
      <<: *app-env
    ports:
      - "${REVERB_PORT:-8080}:8080"   # opsional: browser bisa ws langsung; atau lewat /app di nginx
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8080 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    <<: *app-base
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    environment:
      <<: *app-env

  scheduler:
    <<: *app-base
    command: php artisan schedule:work
    environment:
      <<: *app-env

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-creative_trees_billing}"
      MYSQL_USER: "${DB_USERNAME:-ctb_app}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-change_me}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-change_me_root}"
    command: --default-authentication-plugin=caching_sha2_password --innodb-buffer-pool-size=256M
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD:-change_me_root}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [ctb]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [ctb]

  # ---------- Monitoring (profil: monitoring) ----------
  prometheus:
    image: prom/prometheus:latest
    profiles: [monitoring]
    restart: unless-stopped
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks: [ctb]

  grafana:
    image: grafana/grafana-oss:latest
    profiles: [monitoring]
    restart: unless-stopped
    depends_on: [prometheus]
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD:-admin}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks: [ctb]

  node-exporter:
    image: prom/node-exporter:latest
    profiles: [monitoring]
    restart: unless-stopped
    command:
      - '--path.rootfs=/host'
    pid: host
    volumes:
      - /:/host:ro,rslave
    networks: [ctb]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    profiles: [monitoring]
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks: [ctb]

  mysql-exporter:
    image: prom/mysqld-exporter:latest
    profiles: [monitoring]
    restart: unless-stopped
    command:
      - "--mysqld.address=db:3306"
      - "--mysqld.username=root"
    environment:
      MYSQLD_EXPORTER_PASSWORD: "${DB_ROOT_PASSWORD:-change_me_root}"
    depends_on: [db]
    networks: [ctb]

  redis-exporter:
    image: oliver006/redis_exporter:latest
    profiles: [monitoring]
    restart: unless-stopped
    command: ["--redis.addr=redis://redis:6379"]
    depends_on: [redis]
    networks: [ctb]

volumes:
  db-data:
  redis-data:
  app-storage:
  app-logs:
  prometheus-data:
  grafana-data:

networks:
  ctb:
    driver: bridge
