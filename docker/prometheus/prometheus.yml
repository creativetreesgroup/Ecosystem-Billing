# Prometheus scrape config — semua target di jaringan Docker `ctb`.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: node          # CPU/RAM/disk host (server lokal)
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: cadvisor      # per-kontainer (app/reverb/worker/db/redis)
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: mysql
    static_configs:
      - targets: ['mysql-exporter:9104']

  - job_name: redis
    static_configs:
      - targets: ['redis-exporter:9121']
