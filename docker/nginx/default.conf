# Nginx untuk Creative Trees Billing di Docker.
# fastcgi_pass ke service `app` (PHP-FPM), WebSocket di-proxy ke `reverb`.

server {
    listen 80 default_server;
    server_name _;
    root /var/www/html/public;

    index index.php;
    charset utf-8;
    client_max_body_size 25M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # DNS embedded Docker. WAJIB agar nginx RE-RESOLVE nama service saat
    # kontainer app/reverb dibangun ulang (dapat IP baru) — tanpa ini nginx
    # mengunci IP lama saat start dan setiap `up --build` berujung 502 sampai
    # `web` di-restart manual. Dipakai bersama proxy_pass/fastcgi_pass variabel.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Reverb (WebSocket) di-proxy lewat /app supaya browser cukup satu port (80).
    # Klien Echo boleh diarahkan ke ws(s)://<host>/app bila tidak mengekspos 8080.
    location /app {
        set $reverb_upstream reverb;
        proxy_pass http://$reverb_upstream:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /apps {
        set $reverb_upstream reverb;
        proxy_pass http://$reverb_upstream:8080;
        proxy_set_header Host $host;
    }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        set $app_upstream app;
        fastcgi_pass $app_upstream:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
